spring.application.name=backend
# MySQL Settings
spring.mongodb.database=statusrobot_logs
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# MongoDB Settings
spring.mongodb.uri=${MONGODB_URI}

server.port=8080

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.oauth.redirect-base-url=${OAUTH_REDIRECT_BASE_URL:http://localhost:5173}
app.oauth.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.oauth.discord.client-id=${DISCORD_CLIENT_ID:}
app.oauth.discord.client-secret=${DISCORD_CLIENT_SECRET:}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.tracking-modes=cookie
spring.jpa.open-in-view=false
app.integrations.encryption-key=${INTEGRATION_ENCRYPTION_KEY:}
app.status-pages.owner-email=${STATUS_PAGE_OWNER_EMAIL:}
