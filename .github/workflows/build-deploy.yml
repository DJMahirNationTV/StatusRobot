name: Build, Dockerize and Deploy

on:
  push:
    branches: production
  pull_request:
    branches: production

jobs:
  client-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Upload Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  server-build:
    runs-on: ubuntu-latest
    needs: client-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and analyze
        working-directory: server
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: statusrobot
          MONGODB_URI: mongodb://localhost:27017/statusrobot_logs
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=statusrobot_security-statusrobot

      - name: Make Maven Wrapper Executable
        run: chmod +x server/mvnw

      - name: Build server JAR
        working-directory: server
        run: ./mvnw clean package -DskipTests

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/target/*.jar

  push-to-docker-hub:
    runs-on: ubuntu-latest
    needs: server-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download server JAR
        uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: server/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/statusrobot:latest

  deploy-to-render:
    runs-on: ubuntu-latest
    needs: push-to-docker-hub
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"